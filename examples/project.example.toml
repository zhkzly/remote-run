# Optional project-level configuration for remote-run (<repo_root>/.remote-run.toml).
# Delete any field you do not need; projects without this file run out of the box.
schema_version = 1

# project = "my-project"
# host = "desktop"
# env = "venv"                          # "venv", "none", or an env name from hosts.toml
# workspace = "default"                 # optional: share one remote dir across local git checkout branches
# remote_dir = "/data/your-user/custom" # optional fixed remote directory override

[sync]
use_gitignore = true
ignore = ["docs/", "papers/"]
preserve = ["outputs/", "checkpoints/", "reports/"]

[share]
# Directories shared across all worktrees/branches of this project on the remote host:
# project = ["cache", "pretrained"]
# Host-level shared assets from hosts.toml ("name" or "alias=name"):
# host = ["hf-cache"]

[env_vars]
# Supports {run_id}, {host}, {device}, {artifacts}, {code}, {python}, {shared.<alias>.path|version|sha256}
# OUTPUT_DIR = "{artifacts}"

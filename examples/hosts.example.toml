# ~/.config/remote-run/hosts.toml  (v2 — Machine catalog ONLY, zero project bindings)
# Minimal CPU host needs only `schema_version`, `[hosts.<name>]`, and `ssh`.

schema_version = 2
default_host = "builder"

# Example 1: Minimal CPU build/test machine
[hosts.builder]
ssh = "linux-builder"                         # ~/.ssh/config alias or "user@host"
# port = 22                                   # Optional custom SSH port (1-65535)
# root = "~/.local/share/remote-run-v2"       # Optional remote state root
# path = ["~/.local/bin", "~/.cargo/bin"]     # Optional machine-wide shared PATH entries

# [hosts.builder.env]                         # Optional machine-wide shared env vars (e.g. caches)
# CARGO_HOME = "/srv/cache/cargo"

# Example 2: Multi-GPU workstation (GPU allocation is opt-in per binding or --gpus)
[hosts.gpu-workstation]
ssh = "workstation"
root = "/srv/remote-run-v2"
path = ["~/.local/bin"]

[hosts.gpu-workstation.gpu]
devices = [0, 1]
# locks_dir = "/srv/remote-run-v2/locks"      # Optional trusted 0700 lock directory

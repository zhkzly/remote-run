# <repo>/.remote-run.toml  (v2 — Committable, machine-agnostic project policy)
# Keep personal host names, remote absolute paths, and GPU picks out of this file;
# bind those privately on your laptop with `remote-run bind --scope repo ...`.

schema_version = 2
project = "polyglot-demo"                     # Stable remote project ID across folder renames
path = ["build/bin", "node_modules/.bin"]     # Workspace-relative executable directories

[env]                                         # Machine-agnostic literal environment variables
NODE_ENV = "test"
RUST_BACKTRACE = "1"

[workspace]
shared = ["tool-cache"]                       # Cross-worktree symlinked dirs under projects/<project>/shared/

[sync]
exclude = ["docs/generated/"]                 # Root-relative POSIX globs omitted on sender
preserve = ["build", "node_modules", "target"]# Remote-owned dirs: never uploaded, never ghost-cleaned
max_untracked_mib = 256                       # Language-neutral untracked upload guard (0 = unlimited)

[pull]
max_file_mib = 10                             # Auto-pull artifact size limit in MiB (0 = unlimited)
exclude = ["**/*.trace"]                      # Artifact-relative globs skipped unless pulled via --artifact
